[project]
name = "cs2-price-monitor"
version = "0.1.0"
description = "Local CS2 skin portfolio monitor with manual BUFF price entry."
requires-python = ">=3.12"
dependencies = [
    "APScheduler>=3.10.4",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "SQLAlchemy>=2.0.30",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
cs2_price_monitor = ["catalog/*.json"]
