database:
  url: sqlite:///data/cs2_monitor.sqlite3

pricing:
  suspicious_high_multiplier: "3"
  suspicious_low_multiplier: "0.333333333333333333"

app:
  timezone: UTC
  page_title: CS2 Portfolio Monitor

api:
  mode: manual
  provider: csinventoryapi

csinventoryapi:
  base_url: https://csinventoryapi.com
  timeout_seconds: "10"
  market: buff163
  app_id: "730"
  currency: cny
  price_endpoint_template: /api/v2/prices/{market_name}
  auth_query_param_name: api_key
